name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned: a new ruff release can add rules under the selected codes, and
      # the lint gate must not flip red on a tool upgrade nobody made.
      - name: Install ruff
        run: python -m pip install "ruff==0.16.7"
      - name: Ruff (syntax errors, pyflakes, bugbear)
        run: python -m ruff check .

  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Compile Python sources
        run: python -m compileall -q server tests
      - name: Test (with coverage gate, 3.12 only)
        if: matrix.python-version == '3.12'
        env:
          EMBEDDER_MODE: hash
        run: python -m pytest -q --cov=server --cov-report=term --cov-fail-under=72
      - name: Test (other interpreters)
        if: matrix.python-version != '3.12'
        env:
          EMBEDDER_MODE: hash
        run: python -m pytest -q
      - name: API smoke
        env:
          EMBEDDER_MODE: hash
        run: python -m pytest -q tests/test_api_smoke.py
      - name: Build distributions
        if: matrix.python-version == '3.12'
        run: python -m build
      - name: Validate distributions
        if: matrix.python-version == '3.12'
        run: twine check dist/*

  # The suite must survive a machine that steers it at a real memory store.
  # On 2026-09-13 a developer-level LEVH_SQLITE_DB_PATH made subprocess tests
  # write fixture rows into the real database while CI stayed green, because
  # Actions machines have no such variable. This job plants a decoy pointing at
  # a canary database and runs the full suite against it: any leak now fails
  # loudly here instead of silently writing to production memory on Windows.
  hostile-env:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Plant the decoy store-steering variables
        run: |
          echo "LEVH_SQLITE_DB_PATH=${{ github.workspace }}/canary/stackmemory.db" >> "$GITHUB_ENV"
          echo "SQLITE_DB_PATH=${{ github.workspace }}/canary/stackmemory.db" >> "$GITHUB_ENV"
          echo "STACKMEMORY_SQLITE_DB_PATH=${{ github.workspace }}/canary/stackmemory.db" >> "$GITHUB_ENV"
          echo "LEVH_CONFIG_PATH=${{ github.workspace }}/canary/config.json" >> "$GITHUB_ENV"
      - name: Test against the canary
        env:
          EMBEDDER_MODE: hash
        run: python -m pytest -q


  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Build (lint + typecheck + static export)
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
