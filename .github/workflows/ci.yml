name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true
      # Every job installs from the committed lockfile, not from pyproject's
      # floor pins (issue #146). `--frozen` makes a stale lock a hard failure
      # instead of a silent re-resolve: the same commit now builds the same
      # dependency graph months later. Ruff stays pinned in the dev extra —
      # a new ruff release must not add rules under the selected codes and
      # flip the lint gate red on a tool upgrade nobody made.
      - name: Install locked dev environment
        run: uv sync --frozen --extra dev
      - name: Lockfile is in sync with pyproject.toml
        run: uv lock --check
      - name: Ruff (syntax errors, pyflakes, bugbear)
        run: uv run --frozen ruff check .

  # Type gate (issue #195). Scoped to the tier that is annotation-clean today
  # via [tool.mypy].files in pyproject.toml, so it can land without a
  # big-bang rewrite of the engine mixins. The list is a ratchet: grow it as
  # modules get fixed. Pinned to the same mypy version as the dev extra.
  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install locked dev environment
        run: uv sync --frozen --extra dev
      - name: Mypy (annotated tier)
        run: uv run --frozen mypy

  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      # diff-cover needs a merge-base with the base branch, which a shallow
      # checkout cannot provide (default fetch-depth is 1).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install locked dev environment
        run: uv sync --frozen --extra dev
      - name: Compile Python sources
        run: uv run --frozen python -m compileall -q server tests
      - name: Test (with coverage gate, 3.12 only)
        if: matrix.python-version == '3.12'
        env:
          EMBEDDER_MODE: hash
        run: |
          uv run --frozen python -m pytest -q --cov=server --cov-report=term \
            --cov-report=xml:coverage.xml --cov-fail-under=72
      - name: Diff coverage (changed lines in this PR, 3.12 only)
        # Total coverage is a floor, so a PR could add a whole untested module
        # and still clear it. diff-cover re-checks only the lines this diff
        # touches (issue #206). Skipped on pushes to main: after the squash
        # there is no PR diff left to compare against.
        if: matrix.python-version == '3.12' && github.event_name == 'pull_request'
        run: |
          uv run --frozen diff-cover coverage.xml \
            --compare-branch "origin/${{ github.base_ref }}" \
            --fail-under 70
      - name: Test (other interpreters)
        if: matrix.python-version != '3.12'
        env:
          EMBEDDER_MODE: hash
        run: uv run --frozen python -m pytest -q
      - name: API smoke
        env:
          EMBEDDER_MODE: hash
        run: uv run --frozen python -m pytest -q tests/test_api_smoke.py
      - name: Build distributions
        if: matrix.python-version == '3.12'
        run: uv run --frozen python -m build
      - name: Validate distributions
        if: matrix.python-version == '3.12'
        run: uv run --frozen twine check dist/*

  # The suite must survive a machine that steers it at a real memory store.
  # On 2026-09-13 a developer-level LEVH_SQLITE_DB_PATH made subprocess tests
  # write fixture rows into the real database while CI stayed green, because
  # Actions machines have no such variable. This job plants a decoy pointing at
  # a canary database and runs the full suite against it: any leak now fails
  # loudly here instead of silently writing to production memory on Windows.
  hostile-env:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install locked dev environment
        run: uv sync --frozen --extra dev
      - name: Plant the decoy store-steering variables
        run: |
          echo "LEVH_SQLITE_DB_PATH=${{ github.workspace }}/canary/stackmemory.db" >> "$GITHUB_ENV"
          echo "SQLITE_DB_PATH=${{ github.workspace }}/canary/stackmemory.db" >> "$GITHUB_ENV"
          echo "STACKMEMORY_SQLITE_DB_PATH=${{ github.workspace }}/canary/stackmemory.db" >> "$GITHUB_ENV"
          echo "LEVH_CONFIG_PATH=${{ github.workspace }}/canary/config.json" >> "$GITHUB_ENV"
      - name: Test against the canary
        env:
          EMBEDDER_MODE: hash
        run: uv run --frozen python -m pytest -q


  # Backend counterpart of the frontend npm-audit step (issue #146).
  #
  # Previously this froze the *installed* environment, which CI had just built
  # from pyproject's floor pins — so the audit measured whatever pip happened to
  # resolve that day, not what a release ships. It now exports the committed
  # lockfile (`uv export --frozen`) and audits those exact pins, the same graph
  # every other job installs. `--no-deps` is safe because the export already
  # contains the full transitive closure; without it pip-audit re-resolves and
  # audits a different set than the one we ship.
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Export the locked dependency graph
        # Runtime + dev (the shipped wheel depends only on the core extras);
        # the heavyweight `local`/pdf/file extras are excluded — they are not
        # installed in CI, and exporting them drags in a CUDA-built torch.
        run: |
          uv export --frozen --no-emit-project --no-dev --no-hashes \
            --output-file resolved-requirements.txt
      - name: Audit resolved dependencies
        # uvx runs pip-audit in an ephemeral env, so the audit tool itself is
        # never part of the graph under audit.
        run: uvx pip-audit --strict --no-deps -r resolved-requirements.txt



  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Build (lint + typecheck + static export)
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
      - name: Test (component + unit)
        run: npm test
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
