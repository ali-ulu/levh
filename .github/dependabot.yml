# Supply-chain hygiene (issue #146): weekly update PRs for all three
# ecosystems this repo consumes. The backend graph is now locked in uv.lock,
# so Dependabot's pip updater reads that lockfile and bumps the pin there
# rather than only widening the floor in pyproject.toml.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
