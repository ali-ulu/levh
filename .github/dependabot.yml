# Supply-chain hygiene (issue #146): weekly update PRs for all three
# ecosystems this repo consumes. The backend graph is now locked in uv.lock,
# so Dependabot's pip updater reads that lockfile and bumps the pin there
# rather than only widening the floor in pyproject.toml.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # eslint 10 drops context.getFilename(), which eslint-plugin-react
      # (via eslint-config-next) still calls, and every eslint-plugin-* the
      # config pulls in caps its peer range at ^9. Re-enable once the Next.js
      # plugin ecosystem declares eslint 10 support.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # typescript 7 is the native (Go) compiler port: it removes options this
      # tsconfig still sets (target=es5, baseUrl), and typescript-eslint caps
      # its peer range at <6.1.0, so lint and the sbom job fail outright.
      # Re-enable once typescript-eslint supports TS >=7.1.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
