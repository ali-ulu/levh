[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "levh"
version = "2.31.0"
description = "Local-first memory layer for AI agents and humans"
readme = "README.md"
license = "AGPL-3.0-or-later"
keywords = ["mcp", "memory", "ai", "claude", "cursor", "llm", "forgetting-curve", "spaced-repetition"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "aiosqlite>=0.20",
    "numpy>=2.0",
    "mcp>=1.0,<2",
    "fastmcp>=2.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "cryptography>=42",
]

[project.optional-dependencies]
local = ["sentence-transformers>=3.0", "transformers>=4.40", "torch>=2.0"]
openai = []
# Passphrase-encrypted backups. Bundled in core deps too; this extra is a
# convenience alias for anyone pinning security features explicitly.
secure = ["cryptography>=42"]
# PDF rendering for the full-export audit report.
pdf = ["fpdf2>=2.7"]
# Text extraction for the file-import feature (PDF/Word/Excel uploads).
files = ["pypdf>=4.0", "python-docx>=1.1", "openpyxl>=3.1"]
dev = ["pytest", "pytest-asyncio", "build", "twine", "fpdf2>=2.7", "ruff==0.16.7", "mypy==2.3.1", "pytest-cov>=5.0"]

[project.urls]
Homepage = "https://levh.ai-ulu.com/"
Documentation = "https://levh.ai-ulu.com/"
Repository = "https://github.com/ali-ulu/levh"

[project.scripts]
levh = "server.entrypoint:main"
stackmemory = "server.entrypoint:main"

[tool.setuptools.packages.find]
include = ["server*"]
exclude = ["frontend*", "tests*"]

[tool.setuptools.package-data]
server = ["dashboard/**/*", "fixtures/evaluation/*.json"]

[tool.coverage.run]
source = ["server"]
# Line coverage only: branch analysis doubles the noise without changing what
# this gate protects (a module silently dropping to zero tests).

[tool.coverage.report]
# Baseline measured 2026-09-18 on the full suite (EMBEDDER_MODE=hash):
# 73.2% total, server/core 82.6%, server/routes 82.5%. The gate sits one
# point under the measured floor so real refactors can shuffle lines without
# a green build going red — but a whole module losing its tests fails loudly.
fail_under = 72
show_missing = false
precision = 1

[tool.mypy]
python_version = "3.12"
# Third-party packages ship incomplete or absent stubs; this gate is about our
# own annotations, not theirs.
ignore_missing_imports = true
# Imports outside `files` are parsed only far enough to resolve names, so a
# module that pulls in the engine mixins does not drag their errors in.
follow_imports = "silent"
# The tier below is the part of the tree that is annotation-clean today. It is
# a ratchet, not a target: add modules as they are fixed, never remove one.
# Baseline (2026-09-18, mypy 2.3.1) — zero errors on this list.
files = [
    "server/configs.py",
    "server/scaffold.py",
    "server/core/agent_identity.py",
    "server/core/answerer.py",
    "server/core/attachment_store.py",
    "server/core/backup.py",
    "server/core/conflict.py",
    "server/core/crypto.py",
    "server/core/demo_data.py",
    "server/core/dogfood.py",
    "server/core/entities.py",
    "server/core/env.py",
    "server/core/file_import.py",
    "server/core/full_export.py",
    "server/core/hscore.py",
    "server/core/llm_endpoint.py",
    "server/core/llm_policy.py",
    "server/core/onboarding.py",
    "server/core/organizations.py",
    "server/core/people.py",
    "server/core/rate_limit.py",
    "server/core/restore_service.py",
    "server/core/runtime_config.py",
    "server/core/short_term.py",
    "server/core/summarizer.py",
    "server/core/text_entities.py",
    "server/core/trust.py",
    "server/core/types.py",
    "server/core/vector_store.py",
]
